# nanosig Zephyr 后端契约测试应用配置。
#
# platform/zephyr/port.c 用 #error 强制 CONFIG_POLL / CONFIG_MULTITHREADING /
# CONFIG_HEAP_MEM_POOL_SIZE>0；这里显式满足。

CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=8192

# 启用 nanosig Zephyr 后端（opt-in；select POLL）。
CONFIG_NANOSIG_ZEPHYR=y
CONFIG_POLL=y

# k_malloc / k_aligned_alloc 需要非零堆。
CONFIG_HEAP_MEM_POOL_SIZE=65536

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_MULTITHREADING=y
CONFIG_NUM_PREEMPT_PRIORITIES=16

# 微秒→tick 取整的分辨率下限：1 tick = 1 ms。
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
