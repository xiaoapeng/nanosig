name: nightly

# Deep, slow checks that are kept off the push/PR path so ci.yml stays fast.
# ci.yml (push/PR) covers asan/ubsan/release on the quick + stress suites with
# `ctest -LE nightly`; this workflow runs the full suite including the
# "nightly"-labeled long integration tests, under ThreadSanitizer.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  linux-tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure TSAN
        run: cmake --preset linux-debug-tsan
      - name: Build
        run: cmake --build --preset linux-debug-tsan
      # No -LE: run everything, including the "nightly"-labeled long tests
      # that ci.yml deliberately skips.
      - name: Test
        run: ctest --preset linux-debug-tsan
