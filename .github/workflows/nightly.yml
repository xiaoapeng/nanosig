name: nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  linux-tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure TSAN
        run: cmake --preset linux-debug-tsan
      - name: Build
        run: cmake --build --preset linux-debug-tsan
      - name: Test
        run: ctest --preset linux-debug-tsan

  windows-appverifier-placeholder:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure ASAN
        run: cmake --preset windows-debug-asan
      - name: Build
        run: cmake --build --preset windows-debug-asan
      - name: Test
        run: ctest --preset windows-debug-asan
