name: ci

on:
  pull_request:
  push:
    branches: [ master ]

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        preset: [linux-debug-asan, linux-debug-ubsan, linux-release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }} -LE nightly
      - name: Audits
        run: cmake --build --preset ${{ matrix.preset }} --target sanitize-all

  windows:
    # MinGW-w64 GCC (GNU C, posix thread model) from the runner image. The
    # sources use GNU extensions and the broker tests use POSIX threads, so a
    # GNU toolchain is required; MSVC / clang-cl cannot build this tree.
    # Windows has no sanitizer preset, so the release preset is used
    # (sanitize-all then becomes a no-op audit).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select MinGW-w64 toolchain
        shell: pwsh
        run: |
          if (Test-Path 'C:\mingw64\bin\gcc.exe') {
            Add-Content -Path $env:GITHUB_PATH -Value 'C:\mingw64\bin'
          }
          where.exe gcc
          gcc -v 2>&1 | Select-String 'Thread model'
      - name: Configure
        run: cmake --preset windows-release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
      - name: Build
        run: cmake --build --preset windows-release
      - name: Test
        run: ctest --preset windows-release -LE nightly
      - name: Audits
        run: cmake --build --preset windows-release --target sanitize-all

  macos:
    runs-on: macos-latest
    strategy:
      # NOTE: macos-debug-asan may hang during dyld startup on certain macOS
      # runner images (ASAN shadow memory init deadlocks in
      # StaticSpinMutex::LockSlow). If CI stalls on the ASAN entry, remove it
      # from the matrix until the runner image or Apple Clang ASAN runtime is
      # updated. UBSAN and release presets are unaffected.
      matrix:
        preset: [macos-debug-asan, macos-debug-ubsan, macos-release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }} -LE nightly
      - name: Audits
        run: cmake --build --preset ${{ matrix.preset }} --target sanitize-all

  zephyr:
    # Real Zephyr native_sim (ztest) contract tests for platform/zephyr/port.c.
    # Linux only: native_sim is a host-arch POSIX board. Zephyr is pinned to the
    # 3.7 LTS tag; native_sim uses the host toolchain, so no Zephyr SDK download
    # is required. The repository is injected as an extra Zephyr module via
    # EXTRA_ZEPHYR_MODULES (see zephyr/module.yml). This job is a PR-blocking
    # required check and must be added to branch protection alongside the other
    # checks.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ZEPHYR_VERSION: v3.7.0
      EXTRA_ZEPHYR_MODULES: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build device-tree-compiler
      - name: Install west
        run: pip install west
      - name: Init west workspace (Zephyr ${{ env.ZEPHYR_VERSION }})
        run: |
          west init -m https://github.com/zephyrproject-rtos/zephyr --mr "${ZEPHYR_VERSION}" zephyrproject
      - name: West update
        working-directory: zephyrproject
        run: west update --narrow -o=--depth=1
      - name: Install Zephyr Python requirements
        run: pip install -r zephyrproject/zephyr/scripts/requirements.txt
      - name: Build nanosig ztest (native_sim/native/64)
        working-directory: zephyrproject
        run: west build -b native_sim/native/64 -d build-nanosig "${GITHUB_WORKSPACE}/test/zephyr"
      - name: Run ztest
        working-directory: zephyrproject
        run: ./build-nanosig/zephyr/zephyr.exe

  freertos:
    # Host POSIX harness for platform/freertos/port.c on both Linux and macOS.
    # The preset pulls the pinned FreeRTOS-Kernel (V11.1.0) via FetchContent;
    # macOS additionally applies the guarded pthread-stack patch inside
    # cmake/FreeRTOSPosix.cmake, while Linux builds the unmodified upstream
    # POSIX port. Only the FreeRTOS contract tests are registered here.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset freertos-release
      - name: Build
        run: cmake --build --preset freertos-release
      - name: Test
        run: ctest --preset freertos-release -LE nightly
